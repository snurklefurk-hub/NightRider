<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightRider · Driver</title><link rel="stylesheet" href="nightrider.css"></head>
<body>
<header><a class="brand" href="/">Night<span>Rider</span></a>
<nav><a href="index.html">Ride</a><a href="driver.html" aria-current="page">Driver</a><a href="dispatch.html">Dispatch</a></nav></header>
<main>
<h1>Driver console</h1>
<section class="card">
<label for="driver">Your driver name</label><input id="driver" autocomplete="username" placeholder="Sam Okafor…">
<p id="msg" class="msg" aria-live="polite"></p>
<h2 style="font-weight:400">Open requests</h2>
<div id="requests" class="muted">Enter your name to see requests.</div>
</section>
<section class="card">
<h2 style="font-weight:400;margin-top:0">Your active ride</h2>
<div id="active" class="muted">None.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),msg=$('msg');
let myRide=null;
async function api(path,opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j;}
async function refresh(){
  try{
    const {rides}=await api('/api/rides');
    const name=$('driver').value.trim();
    myRide=rides.find(r=>r.driver===name&&!['completed','cancelled'].includes(r.status))||null;
    const open=rides.filter(r=>r.status==='requested');
    $('requests').innerHTML=open.length?'':'<span class="muted">No open requests.</span>';
    open.forEach(r=>{
      const d=document.createElement('div');d.className='card';
      d.innerHTML=`<strong></strong><div class="muted"></div><div class="num"></div><button type="button">Accept</button>`;
      d.querySelector('strong').textContent=`${r.rider_name} · $${r.fare.toFixed(2)}`;
      d.querySelector('.muted').textContent=`${r.pickup} → ${r.dropoff}`;
      d.querySelector('.num').textContent=`${r.distance_mi} mi`;
      d.querySelector('button').disabled=!name;
      d.querySelector('button').onclick=()=>accept(r.id);
      $('requests').append(d);
    });
    renderActive();
  }catch(e){msg.textContent=e.message;}
}
function renderActive(){
  const a=$('active');
  if(!myRide){a.textContent='None.';return;}
  const next={accepted:'Arrived at pickup',arrived:'Start trip',in_progress:'Complete trip'}[myRide.status];
  a.innerHTML='';
  const s=document.createElement('p');s.innerHTML='<span class="status"></span>';s.querySelector('.status').textContent=myRide.status.replace('_',' ');
  const t=document.createElement('p');t.textContent=`${myRide.rider_name}: ${myRide.pickup} → ${myRide.dropoff} · $${myRide.fare.toFixed(2)}`;
  a.append(s,t);
  if(next){const b=document.createElement('button');b.type='button';b.textContent=next;b.onclick=()=>advance(myRide.id);a.append(b);}
}
async function accept(id){
  const name=$('driver').value.trim();
  try{await api(`/api/rides/${id}/accept`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({driver:name})});msg.textContent='';refresh();}
  catch(e){msg.textContent=e.message;refresh();}
}
async function advance(id){
  try{await api(`/api/rides/${id}/advance`,{method:'POST'});refresh();}catch(e){msg.textContent=e.message;}
}
$('driver').addEventListener('change',refresh);
refresh();setInterval(refresh,4000);
</script>
</body></html>
