name: Validate isolated Midnight web map lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/map-lab*'
      - 'tests/map_lab.test.cjs'
      - '.github/workflows/map-lab-check.yml'
  push:
    branches: [main]
    paths:
      - 'public/map-lab*'
      - 'tests/map_lab.test.cjs'
      - '.github/workflows/map-lab-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated map lab JavaScript
        run: |
          node --check public/map-lab.js
          node --check public/map-lab-midnight.js
          node --check tests/map_lab.test.cjs
      - name: Palette parity and read-only regression checks
        run: node --test tests/map_lab.test.cjs
