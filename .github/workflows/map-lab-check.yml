name: Validate isolated Midnight web map lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/map-lab*'
      - 'public/map-theme*'
      - 'public/dispatch.html'
      - 'public/dispatch-map.js'
      - 'public/index.html'
      - 'tests/map_mode.test.cjs'
      - 'tests/map_lab.test.cjs'
      - '.github/workflows/map-lab-check.yml'
  push:
    branches: [main]
    paths:
      - 'public/map-lab*'
      - 'public/map-theme*'
      - 'public/dispatch.html'
      - 'public/dispatch-map.js'
      - 'public/index.html'
      - 'tests/map_mode.test.cjs'
      - 'tests/map_lab.test.cjs'
      - '.github/workflows/map-lab-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated map lab JavaScript
        run: |
          node --check public/map-lab.js
          node --check public/map-lab-midnight.js
          node --check public/map-theme.js
          node --check public/dispatch-map.js
          node --check tests/map_mode.test.cjs
          node --check tests/map_lab.test.cjs
      - name: Confirm published Leaflet Vector adapter and MapLibre bundles are reachable
        run: |
          set -e
          for url in \
            "https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js" \
            "https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css" \
            "https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"; do
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 --silent --show-error -o /dev/null "$url"
          done
      - name: Palette parity, mode preference and read-only regression checks
        run: node --test tests/map_lab.test.cjs tests/map_mode.test.cjs
