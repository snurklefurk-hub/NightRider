# Render blueprint: tells Render how to run NightRider from GitHub.
# No Python version is pinned here, so Render uses its own current default.
services:
  - type: web
    name: nightrider
    runtime: python
    plan: free
    buildCommand: "echo no build step needed"
    startCommand: "python3 server.py"
    healthCheckPath: /api/rides
