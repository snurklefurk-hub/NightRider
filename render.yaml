# Render blueprint: tells Render how to run NightRider from GitHub.
# No Python version is pinned here, so Render uses its own current default.
services:
  - type: web
    name: nightrider
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nightrider-db
          property: connectionString
      - key: NIGHTRIDER_REQUIRE_DATABASE
        value: "true"
      - key: NIGHTRIDER_COOKIE_SECURE
        value: "true"
      - key: NIGHTRIDER_SETUP_TOKEN
        sync: false
databases:
  - name: nightrider-db
    databaseName: nightrider
    user: nightrider
    plan: basic-256mb

