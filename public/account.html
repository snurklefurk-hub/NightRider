<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b12">
<title>NightRider account</title>
<link rel="stylesheet" href="nightrider.css?v=verdant-1">
<style>
  body { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .account { width:min(100%,440px); }
  .account .brand { display:block; text-align:center; margin-bottom:22px; font-size:1.45rem; }
  .account .card { padding:24px; }
  .account h1 { margin-top:0; }
  .account input { width:100%; margin:6px 0 14px; }
  .tabs { display:flex; gap:8px; margin:16px 0; }
  .tabs button { flex:1; }
  .account .msg { min-height:1.4em; }
  .fine { font-size:.86rem; line-height:1.5; }
  [hidden] { display:none !important; }
</style>
  <link rel="icon" href="/nightrider-mark.svg?v=talmadge-2" type="image/svg+xml">
  <link rel="stylesheet" href="/aero-theme.css?v=2">
  <script>try { document.documentElement.dataset.nrUi =
    localStorage.getItem("nightrider.ui-theme.v1") === "aero" ? "aero" : "classic";
  } catch (_) {}</script>
  <script defer src="/aero-theme.js?v=2"></script>
</head>
<body>
<main class="account">
  <a class="brand" href="/">Night<span>Rider</span></a>
  <section class="card">
    <h1 id="title">Welcome back</h1>
    <p id="intro" class="muted">Sign in to request or manage NightRider rides.</p>
    <div class="tabs" id="tabs">
      <button type="button" id="showLogin">Sign in</button>
      <button type="button" class="alt" id="showRegister">Create rider account</button>
    </div>
    <form id="form" autocomplete="on">
      <div id="displayRow" hidden>
        <label for="displayName">Your name</label>
        <input id="displayName" autocomplete="name" maxlength="60">
      </div>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required minlength="3" maxlength="120">
      <div id="setupRow" hidden>
        <label for="setupToken">One-time setup code</label>
        <input id="setupToken" autocomplete="off">
      </div>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256">
      <button type="submit" id="submit" class="cta">Sign in</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="fine muted">NightRider accounts are managed by NightRider. Use at least 8 characters for your password.</p>
  </section>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var next = params.get("next");
  if (["/", "/driver.html", "/dispatch.html"].indexOf(next) < 0) next = "";
  var setupMode = params.get("setup") === "1";
  var mode = setupMode ? "setup" : "login";
  function go(user) {
    var dest = next || ({ rider: "/", driver: "/driver.html", dispatch: "/dispatch.html" }[user.role] || "/");
    location.replace(dest);
  }
  function setMode(value) {
    mode = value;
    var registering = mode === "register" || mode === "setup";
    $("displayRow").hidden = !registering;
    $("setupRow").hidden = mode !== "setup";
    $("tabs").hidden = mode === "setup";
    $("title").textContent = mode === "setup" ? "Set up dispatch" : registering ? "Create your account" : "Welcome back";
    $("intro").textContent = mode === "setup" ? "Create the first dispatch account for this NightRider service." :
      registering ? "Create a NightRider rider account to request and track rides." : "Sign in to request or manage NightRider rides.";
    $("submit").textContent = mode === "setup" ? "Create dispatch account" : registering ? "Create account" : "Sign in";
    $("password").autocomplete = registering ? "new-password" : "current-password";
    $("msg").textContent = "";
  }
  $("showLogin").addEventListener("click", function () { setMode("login"); });
  $("showRegister").addEventListener("click", function () { setMode("register"); });
  $("form").addEventListener("submit", function (event) {
    event.preventDefault();
    $("submit").disabled = true;
    $("msg").textContent = "Please wait…";
    var body = { username: $("username").value.trim(), password: $("password").value };
    var path = "/api/auth/login";
    if (mode === "register") {
      path = "/api/auth/register";
      body.display_name = $("displayName").value.trim();
    } else if (mode === "setup") {
      path = "/api/auth/setup-dispatch";
      body.display_name = $("displayName").value.trim();
      body.setup_token = $("setupToken").value;
    }
    fetch(path, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (data) { return { ok:r.ok, data:data }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || "Could not sign in.");
        if (result.data.user) return go(result.data.user);
        $("msg").textContent = "Account created. You can now sign in.";
        setMode("login");
      })
      .catch(function (error) { $("msg").textContent = error.message || "Connection failed. Please try again."; })
      .finally(function () { $("submit").disabled = false; });
  });
  fetch("/api/auth/me", { cache:"no-store" }).then(function (r) { return r.json(); })
    .then(function (data) { if (data.user) go(data.user); }).catch(function () {});
  setMode(mode);
})();
</script>
  <script src="/welcome.js?v=4"></script>
  <script src="/nightrider-motion.js"></script>
</body>
</html>
