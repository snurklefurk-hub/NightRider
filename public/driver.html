<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightRider — Driver</title>
<link rel="stylesheet" href="nightrider.css">
</head>
<body>
<header>
  <a class="brand" href="/">Night<span>Rider</span></a>
  <nav>
    <a href="/">Ride</a>
    <a href="/driver.html" aria-current="page">Driver</a>
    <a href="/dispatch.html">Dispatch</a>
  </nav>
</header>
<main>
  <h1>Driver board</h1>
  <div class="card">
    <label for="driverName">Your name</label>
    <input id="driverName" placeholder="e.g. Sam" autocomplete="name">
    <button type="button" id="refresh">Refresh open rides</button>
    <p class="msg" id="msg"></p>
  </div>
  <div class="card">
    <h2>Open requests</h2>
    <div id="openRides" class="grid"></div>
  </div>
  <div class="card">
    <h2>Your active rides</h2>
    <div id="myRides" class="grid"></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function money(n) { return "$" + Number(n).toFixed(2); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function driver() { return $("driverName").value.trim(); }

  function api(path, body) {
    return fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined)
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }

  function rideCard(ride, actions) {
    var el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      '<div class="tripbar"><span class="muted">' + esc(ride.id) + '</span><span class="status">' + esc(ride.status) + "</span></div>" +
      '<p><strong>' + esc(ride.rider_name) + "</strong></p>" +
      '<p class="muted">Pickup: ' + esc(ride.pickup) + "</p>" +
      '<p class="muted">Drop-off: ' + esc(ride.dropoff) + "</p>" +
      '<p class="num">' + ride.distance_mi + " mi \u00b7 " + money(ride.fare) + "</p>" +
      (ride.driver ? '<p class="muted">Driver: ' + esc(ride.driver) + "</p>" : "");
    actions.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = a.label; if (a.alt) { b.className = "alt"; b.style.marginLeft = "0"; }
      b.addEventListener("click", a.run);
      el.appendChild(b);
    });
    return el;
  }

  function load() {
    $("msg").textContent = "";
    api("/api/rides").then(function (res) {
      var rides = res.j.rides || [];
      var open = rides.filter(function (r) { return r.status === "requested"; });
      var mine = rides.filter(function (r) { return r.driver && r.driver === driver() && r.status !== "requested"; });
      var openBox = $("openRides"), myBox = $("myRides");
      openBox.innerHTML = ""; myBox.innerHTML = "";
      if (!open.length) { openBox.innerHTML = '<p class="muted">No open requests right now.</p>'; }
      open.forEach(function (r) {
        openBox.appendChild(rideCard(r, [{ label: "Accept", run: function () { accept(r.id); } }]));
      });
      if (!mine.length) { myBox.innerHTML = '<p class="muted">No active rides for this name.</p>'; }
      mine.forEach(function (r) {
        var acts = [];
        if (r.status !== "completed") { acts.push({ label: "Advance", run: function () { advance(r.id); } }); }
        myBox.appendChild(rideCard(r, acts));
      });
    }).catch(function () { $("msg").textContent = "Could not load rides."; });
  }

  function accept(id) {
    var d = driver();
    if (!d) { $("msg").textContent = "Enter your name before accepting."; return; }
    api("/api/rides/" + id + "/accept", { driver: d }).then(load).catch(function () { $("msg").textContent = "Accept failed."; });
  }
  function advance(id) { api("/api/rides/" + id + "/advance", {}).then(load).catch(function () { $("msg").textContent = "Advance failed."; }); }

  $("refresh").addEventListener("click", load);
  $("driverName").addEventListener("change", load);
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
