<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NightRider — Driver</title>
<link rel="stylesheet" href="nightrider.css">
</head>
<body>
<header>
  <a class="brand" href="/">Night<span>Rider</span></a>
  <nav>
    <a href="/driver.html" aria-current="page">Driver</a>
    <span id="sessionName" class="tiny muted"></span>
    <button type="button" class="alt" id="signOut">Sign out</button>
  </nav>
</header>
<main>
  <h1>Driver board</h1>
  <div class="card">
    <p class="muted">Signed in as <strong id="driverName">—</strong></p>
    <button type="button" id="refresh">Refresh open rides</button>
    <button type="button" class="alt" id="useTestDriver">Use test driver (Savannah City Hall)</button>
    <p class="msg" id="msg"></p>
  </div>
  <div class="card">
    <h2>Open requests</h2>
    <div id="openRides" class="grid"></div>
  </div>
  <div class="card">
    <h2>Your active rides</h2>
    <div id="myRides" class="grid"></div>
  </div>
  <div class="card">
    <h2>Team text</h2>
    <p class="muted">One live feed for team and ride messages. You only see group messages, your private notes with Dispatch, and messages with your assigned riders.</p>
    <div class="chatlog" id="chatLog"></div>
    <p id="chatReplyHint" class="tiny muted" hidden></p>
    <div class="row chatrow">
      <input id="chatText" type="text" placeholder="Message the team…" maxlength="1000" style="flex:1;min-width:0">
      <button type="button" id="chatPrivate" class="alt" aria-pressed="false">Private to Dispatch</button>
      <button type="button" id="chatSend">Send</button>
    </div>
    <p class="msg" id="chatMsg" role="status" aria-live="polite"></p>
  </div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var CFG = { statusLabels: {}, stageAction: {} };
  function statusWord(s) { return CFG.statusLabels[s] || s; }
  function money(n) { return "$" + Number(n).toFixed(2); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  var accountName = "";
  function driver() { return accountName; }

  function api(path, body) {
    return fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined)
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }

  /* ---- presence + dispatch texting -------------------------------------- */
  var chatSeen = 0;
  var chatName = "";
  var chatLoading = false;
  var chatSending = false;
  var chatReplyTarget = null;
  var renderedChatIds = {};

  /* Heartbeat so dispatch can list this driver as active. The status is the
     ride stage this driver is currently in, or "available" when idle. */
  var myStage = "available";
  function ping(status) {
    var d = driver();
    if (!d) { return; }
    api("/api/drivers/ping", { name: d, status: status || myStage || "available" }).catch(function () {});
  }

  function setChatReply(message) {
    if (message.ride_id) {
      chatReplyTarget = { ride_id: message.ride_id,
        audience: message.audience === "dispatch" ? "dispatch" : "shared" };
      $("chatReplyHint").textContent = "Replying in ride " + message.ride_id +
        (chatReplyTarget.audience === "dispatch" ? " · Dispatch only" : " · rider and Dispatch") + " · click to cancel";
      $("chatPrivate").hidden = true;
    } else if (message.role === "dispatch") {
      chatReplyTarget = { private: true };
      $("chatReplyHint").textContent = "Replying privately to Dispatch · click to cancel";
      $("chatPrivate").hidden = true;
    } else {
      chatReplyTarget = null;
      $("chatReplyHint").textContent = "Replying to the team";
      $("chatPrivate").hidden = false;
    }
    $("chatReplyHint").hidden = false; $("chatText").focus();
  }

  function clearChatReply() {
    chatReplyTarget = null; $("chatReplyHint").hidden = true;
    $("chatPrivate").hidden = false;
    $("chatText").placeholder = privateOn() ? "Private note to Dispatch…" : "Message the team…";
  }

  function loadChat() {
    if (!driver() || chatLoading) { return; }
    chatLoading = true;
    fetch("/api/chat/messages?since=" + chatSeen, {cache:"no-store"})
      .then(function (r) { return r.json(); })
      .then(function (res) {
        (res.messages || []).forEach(function (m) {
          var key = (m.message_kind || "chat") + ":" + m.id;
          if (m.id && renderedChatIds[key]) { return; }
          if (m.id) { renderedChatIds[key] = true; }
          if (m.at > chatSeen) { chatSeen = m.at; }
          var mine = !!m.mine;
          var priv = m.channel === "private" || m.audience === "dispatch";
          var wrap = document.createElement("div");
          wrap.className = "chatwrap " + (mine ? "me" : "them");
          var div = document.createElement("div");
          div.className = "chatline " + (mine ? "me" : "them") + (priv ? " private" : "");
          var color = /^#[0-9a-f]{6}$/i.test(m.chat_color || "") ? m.chat_color : "#ffffff";
          div.style.setProperty("--sender-color", color);
          var who = document.createElement("span"); who.className = "who";
          who.style.color = color;
          who.textContent = (mine ? "You" : (m.from || "Dispatch")) +
            (m.ride_id ? " · Ride " + m.ride_id : "") + (priv ? " · private" : "");
          div.appendChild(who); div.appendChild(document.createTextNode(m.text || ""));
          var time = document.createElement("span"); time.className = "tiny muted";
          time.textContent = " " + new Date(m.at * 1000).toLocaleTimeString();
          div.appendChild(time); wrap.appendChild(div);
          if (!mine) {
            var reply = document.createElement("button"); reply.type = "button";
            reply.className = "alt chatreply"; reply.textContent = "Reply";
            reply.addEventListener("click", function () { setChatReply(m); });
            wrap.appendChild(reply);
          }
          $("chatLog").appendChild(wrap);
        });
        $("chatLog").scrollTop = $("chatLog").scrollHeight;
      }).catch(function () {}).then(function () { chatLoading = false; });
  }

  function sendChat() {
    var text = $("chatText").value.trim();
    if (!driver()) { $("chatMsg").textContent = "Sign in to send a message."; return; }
    if (!text || chatSending) { return; }
    chatSending = true; $("chatSend").disabled = true;
    var body = Object.assign({text:text}, chatReplyTarget || {});
    if (!chatReplyTarget && privateOn()) { body.private = true; }
    api("/api/chat/messages", body)
      .then(function (res) {
        $("chatSend").disabled = false; chatSending = false;
        if (!res.ok) { $("chatMsg").textContent = res.j.error || "Send failed."; return; }
        $("chatText").value = ""; $("chatMsg").textContent = "";
        clearChatReply(); $("chatPrivate").setAttribute("aria-pressed", "false");
        $("chatText").placeholder = "Message the team…";
        loadChat();
      })
      .catch(function () { chatSending = false; $("chatSend").disabled = false; $("chatMsg").textContent = "Send failed."; });
  }

  function rideCard(ride, actions) {
    var el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      '<div class="tripbar"><span class="muted">' + esc(ride.id) + '</span><span class="status">' + esc(statusWord(ride.status)) + "</span></div>" +
      '<p><strong>' + esc(ride.rider_name) + "</strong></p>" +
      '<p class="muted">Pickup: ' + esc(ride.pickup) + "</p>" +
      '<p class="muted">Drop-off: ' + esc(ride.dropoff) + "</p>" +
      '<p class="num">' + ride.distance_mi + " mi \u00b7 " + money(ride.fare) + "</p>" +
      (ride.driver_to_pickup_mi ? '<p class="muted">Driver to pickup: ' + ride.driver_to_pickup_mi + " mi</p>" : "") +
      (ride.driver ? '<p class="muted">Driver: ' + esc(ride.driver) + "</p>" : "");
    el.appendChild(riderRating(ride));
    actions.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = a.label; if (a.alt) { b.className = "alt"; b.style.marginLeft = "0"; }
      b.addEventListener("click", function (ev) {
        // A short pressed-state flair, then run the action.
        b.classList.remove("pressed");
        void b.offsetWidth; /* restart the animation on repeat presses */
        b.classList.add("pressed");
        setTimeout(function () { b.classList.remove("pressed"); }, 420);
        a.run(ev);
      });
      el.appendChild(b);
    });
    return el;
  }

  var ISSUES = ["No-show", "Rude", "Messy", "Unsafe", "Payment issue", "Other"];

  /* Rate the rider behind this ride. The score is filed against the hidden
     rider id on the server, so the driver sees the running total but never
     the id itself. */
  function riderRating(ride) {
    var wrap = document.createElement("div");
    var s = ride.rider_summary || {};
    var head = document.createElement("p");
    head.className = "tiny muted";
    head.textContent = (s.ratings ? s.avg + "\u2605 avg over " + s.ratings + " rating(s)" : "No ratings yet") +
      (s.issues ? " \u00b7 " + s.issues + " flagged issue(s)" : "");
    wrap.appendChild(head);
    if (ride.status === "completed" || ride.status === "cancelled") { return wrap; }

    var box = document.createElement("div");
    box.className = "rate";
    for (var n = 1; n <= 5; n++) {
      (function (n) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "alt star"; b.style.marginLeft = "0"; b.textContent = n;
        b.title = "Rate this rider " + n + "/5";
        b.addEventListener("click", function () { rate(ride, n, wrap); });
        box.appendChild(b);
      })(n);
    }
    wrap.appendChild(box);
    var issues = document.createElement("div");
    issues.className = "issues";
    issues.innerHTML = ISSUES.map(function (i) {
      return '<label class="tiny"><input type="checkbox" class="issuepick" value="' + esc(i) + '"> ' + esc(i) + "</label>";
    }).join(" ");
    wrap.appendChild(issues);
    return wrap;
  }

  function rate(ride, stars, wrap) {
    var issues = [];
    wrap.querySelectorAll(".issuepick:checked").forEach(function (c) { issues.push(c.value); });
    api("/api/rides/" + ride.id + "/rating", { by: "driver", by_name: driver(), stars: stars, issues: issues })
      .then(function (res) {
        if (!res.ok) { $("msg").textContent = "Rating not saved: " + (res.j.error || "error"); return; }
        $("msg").textContent = "Saved " + stars + "/5 for " + ride.rider_name + "'s rider profile.";
        load();
      })
      .catch(function () { $("msg").textContent = "Rating failed."; });
  }

  function load() {
    $("msg").textContent = "";
    api("/api/rides").then(function (res) {
      var rides = res.j.rides || [];
      var open = rides.filter(function (r) { return r.status === "requested"; });
      var mine = rides.filter(function (r) { return r.driver && r.driver === driver() && r.status !== "requested"; });
      /* Report the stage of the ride we are on so dispatch shows it live. */
      var live = mine.filter(function (r) { return r.status !== "completed" && r.status !== "cancelled"; });
      myStage = live.length ? live[live.length - 1].status : "available";
      syncChatConversations(mine);
      var openBox = $("openRides"), myBox = $("myRides");
      openBox.innerHTML = ""; myBox.innerHTML = "";
      if (!open.length) { openBox.innerHTML = '<p class="muted">No open requests right now.</p>'; }
      open.forEach(function (r) {
        openBox.appendChild(rideCard(r, [{ label: "Accept", run: function () { accept(r.id); } }]));
      });
      if (!mine.length) { myBox.innerHTML = '<p class="muted">No active rides for this name.</p>'; }
      mine.forEach(function (r) {
        var acts = [];
        var label = CFG.stageAction[r.status];
        if (label) { acts.push({ label: label, run: function () { advance(r.id); } }); }
        if (r.status !== "completed" && r.status !== "cancelled") {
          acts.push({ label: "Release ride to Dispatch", alt: true, run: function () { cancelRide(r.id); } });
        }
        myBox.appendChild(rideCard(r, acts));
      });
    }).catch(function () { $("msg").textContent = "Could not load rides."; });
  }

  /* Share the driver's own position so the server can price the
     $0.25/mile driver -> pickup leg. If the browser will not share it, we
     still accept the ride; only that leg goes unpriced. */
  function locate(done) {
    var settled = false;
    var finish = function (c) { if (!settled) { settled = true; done(c); } };
    if (!navigator.geolocation) { finish(null); return; }
    navigator.geolocation.getCurrentPosition(
      function (p) { finish({ lat: p.coords.latitude, lng: p.coords.longitude }); },
      function () { finish(null); },
      { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
    );
    setTimeout(function () { finish(null); }, 6500);
  }

  /* Test/engineering mode: accept as the stand-in driver that is always
     parked at Savannah City Hall instead of using this device's position. */
  var testDriver = false;

  function accept(id) {
    var d = driver();
    if (!d) { $("msg").textContent = "Enter your name before accepting."; return; }
    $("msg").textContent = "Accepting\u2026";
    if (testDriver) {
      api("/api/rides/" + id + "/accept", { driver: d, demo: true })
        .then(load).catch(function () { $("msg").textContent = "Accept failed."; });
      return;
    }
    locate(function (coords) {
      api("/api/rides/" + id + "/accept", { driver: d, driver_coords: coords })
        .then(load).catch(function () { $("msg").textContent = "Accept failed."; });
    });
  }
  function advance(id) { api("/api/rides/" + id + "/advance", {}).then(load).catch(function () { $("msg").textContent = "Advance failed."; }); }
  function cancelRide(id) {
    if (!window.confirm("Return this ride to Dispatch’s open queue? The rider’s request will stay active.")) { return; }
    api("/api/rides/" + id + "/cancel", {}).then(function (res) {
      if (!res.ok) { throw new Error(res.j.error || "Could not cancel ride."); }
      $("msg").textContent = "Ride returned to Dispatch’s open queue.";
      load();
    }).catch(function (error) { $("msg").textContent = error.message || "Cancel failed."; });
  }

  $("useTestDriver").addEventListener("click", function () {
    testDriver = !testDriver;
    if (testDriver) {
      $("msg").textContent = "Test driver on \u2014 accepts will be priced from Savannah City Hall.";
    } else {
      $("msg").textContent = "Test driver off \u2014 accepts will use this device's location.";
    }
    $("useTestDriver").textContent = testDriver
      ? "Test driver: ON (Savannah City Hall)"
      : "Use test driver (Savannah City Hall)";
    load();
  });

  $("refresh").addEventListener("click", load);
  function privateOn() { return $("chatPrivate").getAttribute("aria-pressed") === "true"; }
  $("chatPrivate").addEventListener("click", function () {
    var on = !privateOn();
    $("chatPrivate").setAttribute("aria-pressed", on ? "true" : "false");
    $("chatText").placeholder = on ? "Private note to Dispatch…" : "Message the team…";
  });
  $("chatReplyHint").addEventListener("click", function () { clearChatReply(); });
  $("chatSend").addEventListener("click", sendChat);
  $("chatText").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendChat(); }
  });
  api("/api/config").then(function (res) {
    if (res.ok) {
      CFG.statusLabels = res.j.statusLabels || {};
      CFG.stageAction = res.j.stageAction || {};
      if (!res.j.demoDriver) $("useTestDriver").hidden = true;
    }
  }).catch(function () {}).then(function () {
    return fetch("/api/auth/me", {cache:"no-store"}).then(function (r) { return r.json(); });
  }).then(function (data) {
    if (data.user) {
      accountName = data.user.display_name;
      $("driverName").textContent = accountName;
      $("sessionName").textContent = accountName;
    }
    load();
    ping();
  }).catch(function () { $("msg").textContent = "Could not load your NightRider account."; });
  setInterval(load, 5000);
  setInterval(loadChat, 4000);
  setInterval(function () { ping(); }, 30000);
})();
</script>
<script>
document.getElementById("signOut").addEventListener("click", function () {
  fetch("/api/auth/logout", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"})
    .finally(function () { location.replace("/account.html"); });
});
</script>
</body>
</html>
