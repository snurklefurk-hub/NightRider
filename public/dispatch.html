<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightRider · Dispatch</title><link rel="stylesheet" href="nightrider.css"></head>
<body>
<header><a class="brand" href="/">Night<span>Rider</span></a>
<nav><a href="index.html">Ride</a><a href="driver.html">Driver</a><a href="dispatch.html" aria-current="page">Dispatch</a></nav></header>
<main>
<h1>Dispatch board</h1>
<section class="card">
<p id="msg" class="msg" aria-live="polite"></p>
<div style="overflow-x:auto"><table>
<thead><tr><th scope="col">Ride</th><th scope="col">Rider</th><th scope="col">Route</th><th scope="col">Fare</th><th scope="col">Driver</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<p class="muted">Refreshes every 4 seconds.</p>
</section>
</main>
<script>
const rows=document.getElementById('rows'),msg=document.getElementById('msg');
const LABEL={requested:'Requested',accepted:'Accepted',arrived:'Arrived',in_progress:'In progress',completed:'Completed',cancelled:'Cancelled'};
async function load(){
  try{
    const r=await fetch('/api/rides');const {rides}=await r.json();
    rows.innerHTML='';
    if(!rides.length){rows.innerHTML='<tr><td colspan="7" class="muted">No rides yet.</td></tr>';return;}
    rides.forEach(x=>{
      const tr=document.createElement('tr');
      const cells=[x.id,x.rider_name,`${x.pickup} → ${x.dropoff} (${x.distance_mi} mi)`,`$${x.fare.toFixed(2)}`,x.driver||'—',LABEL[x.status]||x.status];
      cells.forEach((c,i)=>{const td=document.createElement('td');td.textContent=c;if(i===3)td.className='num';tr.append(td);});
      const act=document.createElement('td');
      if(!['completed','cancelled'].includes(x.status)){
        const b=document.createElement('button');b.type='button';b.className='alt';b.textContent='Cancel';
        b.setAttribute('aria-label',`Cancel ride ${x.id} for ${x.rider_name}`);
        b.onclick=()=>act_(x.id,'cancel');act.append(b);
      }
      tr.append(act);rows.append(tr);
    });
  }catch(e){msg.textContent='Could not load rides.';}
}
async function act_(id,action){
  const r=await fetch(`/api/rides/${id}/${action}`,{method:'POST'});
  const j=await r.json();msg.textContent=r.ok?'':j.error;load();
}
load();setInterval(load,4000);
</script>
</body></html>
